# Ejemplo para el servidor web del Data Center: publica el contenedor en /registro-civil/
# El sistema funciona tanto si se pasa la ruta completa (como acá) como si se quita el prefijo.

# Redirecciones relativas: conservan el dominio y el puerto originales
absolute_redirect off;

location = /registro-civil {
    return 301 /registro-civil/;
}

location /registro-civil/ {
    proxy_pass http://127.0.0.1:8000;          # sin barra final: pasa la ruta completa
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6M;                   # imágenes de noticias de hasta 5 MB
}
