server {
    listen 80;

    location = / {
        return 200 "Dominio de prueba: el sistema esta en /registro-civil/\n";
    }

    absolute_redirect off;   # redirecciones relativas: conservan dominio y puerto

    location = /registro-civil {
        return 301 /registro-civil/;
    }

    location /registro-civil/ {
        proxy_pass http://registro-civil:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6M;
    }
}
